name: Update latest videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the YouTube feed into data/videos.json
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          CHANNEL_ID = "UCg8qpYcdzVdtdXU9lWK7mQQ"  # @PhonoByteWorld
          FEED = f"https://www.youtube.com/feeds/videos.xml?channel_id={CHANNEL_ID}"
          NS = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015",
                "media": "http://search.yahoo.com/mrss/"}
          OUT = Path("data/videos.json")
          HASHTAG = re.compile(r"#(\w+)")
          SKIP = {"shorts", "short", "news", "breakingnews", "phonobyteworld"}

          def clean_title(t):
              return re.sub(r"\s*[|•\-–]?\s*#\w+", "", t).strip(" |-–•")

          def summary(desc):
              for para in re.split(r"\n\s*\n", desc):
                  text = HASHTAG.sub("", para).strip()
                  if len(text) > 30 and not text.lower().startswith(("source", "music", "video:", "credit")):
                      return text if len(text) <= 240 else text[:240].rsplit(" ", 1)[0] + "…"
              return ""

          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          videos, tags = [], Counter()
          for e in root.findall("a:entry", NS):
              g = e.find("media:group", NS)
              title = e.findtext("a:title", "", NS)
              desc = g.findtext("media:description", "", NS) if g is not None else ""
              found = [t for t in HASHTAG.findall(f"{title} {desc}") if t.lower() not in SKIP]
              tags.update({t.lower(): t for t in found}.values())
              stats = g.find("media:community/media:statistics", NS) if g is not None else None
              thumb = g.find("media:thumbnail", NS) if g is not None else None
              vid = e.findtext("yt:videoId", "", NS)
              videos.append({"id": vid, "title": clean_title(title), "summary": summary(desc),
                             "tags": list(dict.fromkeys(found))[:6], "published": e.findtext("a:published", "", NS),
                             "views": int(stats.get("views", 0)) if stats is not None else 0,
                             "thumb": thumb.get("url") if thumb is not None else f"https://i.ytimg.com/vi/{vid}/hqdefault.jpg",
                             "url": f"https://www.youtube.com/shorts/{vid}"})
          data = {"channel": "https://www.youtube.com/@PhonoByteWorld", "videos": videos,
                  "topics": [t for t, _ in tags.most_common(10)]}
          old = json.loads(OUT.read_text()) if OUT.exists() else {}
          if {k: v for k, v in old.items() if k != "updated"} != data:
              data["updated"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
              OUT.parent.mkdir(parents=True, exist_ok=True)
              OUT.write_text(json.dumps(data, indent=1, ensure_ascii=False) + "\n")
          print(len(videos), "videos")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "Update latest videos" && git push)
